<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>Mis Calculadoras</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #3b82f6;
      --bg: #f0f4ff;
      --white: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(30,58,138,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%);
      color: white;
      padding: 30px 20px 24px;
      text-align: center;
    }
    header .logo { font-size: 2.4rem; margin-bottom: 8px; }
    header h1 {
      font-size: clamp(1.3rem, 5vw, 1.9rem);
      font-weight: 800;
      margin-bottom: 6px;
    }
    header p { font-size: 0.88rem; opacity: 0.82; }
    #menu {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .menu-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: center;
    }
    .cards { display: flex; flex-direction: column; gap: 13px; }
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.18s, transform 0.14s, box-shadow 0.18s;
      width: 100%;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
      appearance: none;
      background-color: var(--white);
    }
    .card:hover, .card:focus {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(37,99,235,0.16);
      outline: none;
    }
    .card:active { transform: translateY(0); }
    .card-icon {
      font-size: 2rem;
      width: 54px; height: 54px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 13px;
      flex-shrink: 0;
    }
    .c1 { background: #eff6ff; }
    .c2 { background: #fff7ed; }
    .c3 { background: #f0fdf4; }
    .c4 { background: #ecfeff; }
    .c5 { background: #faf5ff; }
    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 0.97rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .card-desc { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; }
    .card-arrow { font-size: 1.3rem; color: var(--accent); flex-shrink: 0; }

    /* VIEWER */
    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      background: white;
      z-index: 100;
    }
    #viewer.active { display: flex; }
    #viewer-topbar {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      flex-shrink: 0;
      min-height: 52px;
    }
    #btn-back {
      background: rgba(255,255,255,0.18);
      border: none;
      color: white;
      font-size: 1rem;
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-back:hover { background: rgba(255,255,255,0.28); }
    #viewer-title {
      font-size: 0.93rem;
      font-weight: 700;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #app-frame { flex: 1; border: none; width: 100%; background: white; }

    #install-banner {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e3a8a;
      color: white;
      border-radius: 14px;
      padding: 14px 18px;
      box-shadow: 0 8px 32px rgba(30,58,138,0.35);
      z-index: 200;
      max-width: calc(100vw - 32px);
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 0.87rem;
    }
    #install-banner span { flex: 1; line-height: 1.4; }
    #btn-install {
      background: white; color: #1e3a8a;
      border: none; padding: 8px 14px;
      border-radius: 8px; font-weight: 700;
      font-size: 0.84rem; cursor: pointer; white-space: nowrap;
    }
    #btn-close-banner {
      background: none; border: none;
      color: rgba(255,255,255,0.7);
      font-size: 1.2rem; cursor: pointer; padding: 2px;
    }
    footer {
      text-align: center; padding: 16px;
      font-size: 0.74rem; color: var(--text-muted);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🧮</div>
  <h1>Mis Calculadoras</h1>
  <p>Selecciona una herramienta para comenzar</p>
</header>

<main id="menu">
  <p class="menu-label">📱 5 herramientas disponibles</p>
  <div class="cards">

    <button class="card" onclick="openApp('hipoteca.html','🏠 Calculadora Hipotecaria')">
      <div class="card-icon c1">🏠</div>
      <div class="card-body">
        <div class="card-title">Calculadora Hipotecaria</div>
        <div class="card-desc">Gastos de compra, cuota mensual, hipoteca necesaria y dinero requerido</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

    <button class="card" onclick="openApp('amortizacion.html','📊 Hipoteca + Amortización')">
      <div class="card-icon c2">📊</div>
      <div class="card-body">
        <div class="card-title">Hipoteca + Amortización</div>
        <div class="card-desc">Simula aportaciones parciales: compara reducir cuota vs. reducir plazo</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

    <button class="card" onclick="openApp('imc.html','⚖️ Calculadora de IMC')">
      <div class="card-icon c3">⚖️</div>
      <div class="card-body">
        <div class="card-title">Calculadora de IMC</div>
        <div class="card-desc">IMC actual y saludable ajustado por edad, sexo, altura y peso</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

    <button class="card" onclick="openApp('sal.html','🏊 Calculadora Sal Piscina')">
      <div class="card-icon c4">🏊</div>
      <div class="card-body">
        <div class="card-title">Calculadora Sal Piscina</div>
        <div class="card-desc">Kg de sal necesarios para tu piscina con clorador salino</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

    <button class="card" onclick="openApp('ahorro.html','🎯 Meta de Ahorro')">
      <div class="card-icon c5">🎯</div>
      <div class="card-body">
        <div class="card-title">Meta de Ahorro</div>
        <div class="card-desc">Planifica tu ahorro mensual para alcanzar una meta económica</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

  </div>
</main>

<footer>TSA © 2025 · Mis Calculadoras</footer>

<div id="viewer">
  <div id="viewer-topbar">
    <button id="btn-back" onclick="closeApp()">&#8592; Menu</button>
    <span id="viewer-title">Calculadora</span>
  </div>
  <iframe id="app-frame" src="" title="Calculadora"></iframe>
</div>

<div id="install-banner">
  <span>📲 <strong>Instala la app</strong> en tu dispositivo</span>
  <button id="btn-install">Instalar</button>
  <button id="btn-close-banner" title="Cerrar">&#x2715;</button>
</div>

<script>
  function openApp(src, title) {
    var frame = document.getElementById('app-frame');
    frame.src = 'about:blank';
    frame.onload = null;
    setTimeout(function() {
      frame.src = src;
      document.getElementById('viewer-title').textContent = title;
    }, 50);
    document.getElementById('viewer').classList.add('active');
    document.body.style.overflow = 'hidden';
    history.pushState({ app: src }, title);
  }
  function closeApp() {
    document.getElementById('viewer').classList.remove('active');
    document.getElementById('app-frame').src = '';
    document.body.style.overflow = '';
  }
  window.addEventListener('popstate', function() {
    if (document.getElementById('viewer').classList.contains('active')) closeApp();
  });

  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('install-banner').style.display = 'flex';
  });
  document.getElementById('btn-install').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('install-banner').style.display = 'none';
  });
  document.getElementById('btn-close-banner').addEventListener('click', () => {
    document.getElementById('install-banner').style.display = 'none';
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
